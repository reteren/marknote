[package]
name = "marknote"
version = "1.0.1"
description = "Fast Markdown editor for Windows"
edition = "2021"
rust-version = "1.77"

[lib]
name = "marknote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-window-state = "2.4.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

notify = "8.2.0"
notify-debouncer-full = "0.6"

encoding_rs = "0.8"
chardetng = "0.1"

anyhow = "1"
thiserror = "2"

# Веха M6 — остальные форматы. Раскомментировать при реализации.
# pdf-extract = "0.12.0"
# docx-rs = "0.4.22"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2.11.5", features = ["test"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemInformation",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

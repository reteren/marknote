name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      # The tag and manifest version are set manually in different files, so they
      # can silently diverge. Check before building; otherwise a half-hour build
      # can finish with an installer carrying the wrong version on the release tab.
      - name: Check tag matches manifest version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $manifest = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $manifest) {
            throw "Tag v$tag does not match version $manifest in tauri.conf.json"
          }
          "VERSION=$manifest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and publish release
        run: npm run tauri build

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Build the name from the version rather than a wildcard: the bundle
          # directory survives builds (it is in Cargo's cache), and a wildcard
          # would also pick up installers from previous versions.
          files: src-tauri/target/release/bundle/nsis/MarkNote_${{ env.VERSION }}_x64-setup.exe
          body_path: scripts/RELEASE_NOTES.md
